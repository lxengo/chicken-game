<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ちきんゲーム</title>

<style>

@font-face{
font-family:"JK";
src:url("./JKMaruGothic.ttf");
}

body{
margin:0;
background:#ddd;
font-family:"JK",sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#gameBox{
width:90vw;
max-width:800px;
aspect-ratio:16/9;
background:black;
border-radius:20px;
overflow:hidden;
}

canvas{
width:100%;
height:100%;
}

</style>
</head>

<body>

<div id="gameBox">
<canvas id="game"></canvas>
</div>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=1280
canvas.height=720

let state="title"

let score=0
let highScore=
Number(
localStorage.getItem("high")||0
)

let maps=[
"🌳草原",
"🌋火山",
"🌙月",
"🪐宇宙"
]

let selectedMap=
Number(
localStorage.getItem("map")||0
)

let skins=[
"🐔",
"🐤",
"🍗",
"🦉",
"🦅",
"🐉"
]

let selectedSkin=
Number(
localStorage.getItem("skin")||0
)

let skinInfo=[
"★★★",
"★★★",
"★★★",
"★★★★",
"★★★★",
"★★★★★"
]

function isUnlocked(i){

if(i<=2) return true

if(i==3 && highScore>=7000)
return true

if(i==4 && highScore>=7000)
return true

if(i==5 && highScore>=8000)
return true

return false
}

function isMapUnlocked(i){

if(i==0) return true

if(i==1 && highScore>=5000)
return true

if(i==2 && highScore>=8000)
return true

if(i==3 && highScore>=9000)
return true

return false
}

// 能力

let jumpPower=16
let gravity=0.8

function applySkin(){

if(selectedSkin==0){
jumpPower=14
gravity=0.85
}

if(selectedSkin==1){
jumpPower=17
gravity=0.8
}

if(selectedSkin==2){
jumpPower=17
gravity=0.8
}

if(selectedSkin==3){
jumpPower=18
gravity=0.78
}

if(selectedSkin==4){
jumpPower=19
gravity=0.76
}

if(selectedSkin==5){
jumpPower=20
gravity=0.75
}

}

// 音

let audioCtx
let soundEnabled=false

function enableSound(){

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)()

}

soundEnabled=true

}

function playJump(){

if(!soundEnabled)return

let osc=
audioCtx.createOscillator()

let gain=
audioCtx.createGain()

osc.type="square"

osc.frequency.setValueAtTime(
400,
audioCtx.currentTime
)

osc.frequency.exponentialRampToValueAtTime(
900,
audioCtx.currentTime+0.12
)

gain.gain.setValueAtTime(
0.15,
audioCtx.currentTime
)

gain.gain.exponentialRampToValueAtTime(
0.001,
audioCtx.currentTime+0.15
)

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
osc.stop(audioCtx.currentTime+0.15)

}

function playDead(){

if(!soundEnabled)return

let osc=
audioCtx.createOscillator()

let gain=
audioCtx.createGain()

osc.type="sawtooth"

osc.frequency.setValueAtTime(
400,
audioCtx.currentTime
)

osc.frequency.exponentialRampToValueAtTime(
100,
audioCtx.currentTime+0.3
)

gain.gain.value=0.15

osc.connect(gain)
gain.connect(audioCtx.destination)

osc.start()
osc.stop(audioCtx.currentTime+0.3)

}
// エフェクト

let effects=[]

function createEffect(){

if(selectedSkin!=5)return

for(let i=0;i<6;i++){

effects.push({

x:chicken.x+25,
y:chicken.y+25,

vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,

life:1

})

}

}

// ゲーム

let baseSpeed=7
let speed=7
let maxSpeed=15

let chicken
let obstacles=[]

let ignoreTapUntil=0

let lastInputTime=0
const inputGap=200

function tap(){

enableSound()

if(state!="game")
return

let now=Date.now()

if(
now-lastInputTime
<
inputGap
)return

lastInputTime=now

if(chicken.jump<2){

if(chicken.jump===0){

chicken.vy=
-jumpPower

}
else{

chicken.vy=
-(jumpPower-2)

}

chicken.jump++

createEffect()

playJump()

}

}

// スマホ

if(
'ontouchstart'
in
window
){

document.addEventListener(
"touchstart",
tap
)

}else{

document.addEventListener(
"mousedown",
tap
)

}

function reset(){

chicken={

x:200,
y:560,

vy:0,

jump:0

}

obstacles=[]

effects=[]

score=0

speed=baseSpeed

}

function start(mode){

if(mode=="easy"){

baseSpeed=5
maxSpeed=10

}
else if(mode=="hard"){

baseSpeed=9
maxSpeed=18

}
else{

baseSpeed=7
maxSpeed=15

}

applySkin()

reset()

state="game"

ignoreTapUntil=
Date.now()+500

}

setInterval(()=>{

if(state=="game"){

obstacles.push({

x:1280,
y:540

})

}

},1200)

function update(){

if(state!="game")
return

chicken.vy+=gravity

chicken.y+=chicken.vy

if(chicken.y>560){

chicken.y=560

chicken.vy=0

// 二段ジャンプ復活

chicken.jump=0

}

speed=
baseSpeed+
score*0.005

if(speed>maxSpeed)
speed=maxSpeed

obstacles.forEach(o=>{

o.x-=speed

if(

chicken.x
<
o.x+40

&&

chicken.x+50
>
o.x

&&

chicken.y
<
o.y+80

&&

chicken.y+50
>
o.y

){

state="gameover"

playDead()

if(score>highScore){

highScore=score

localStorage.setItem(
"high",
highScore
)

}

}

})

effects.forEach(e=>{

e.x+=e.vx

e.y+=e.vy

e.life-=0.03

})

effects=
effects.filter(
e=>e.life>0
)

obstacles=
obstacles.filter(
o=>o.x>-50
)

score++

}
// ボタン

function drawBtn(x,y,w,h,text){

ctx.fillStyle="white"
ctx.fillRect(x,y,w,h)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="35px JK"

ctx.fillText(
text,
x+w/2,
y+h/2+12
)

}

// タイトル

function drawTitle(){

ctx.fillStyle="#87CEEB"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="70px JK"

ctx.fillText(
"🐔 ちきんゲーム",
640,
180
)

// 2列UI

drawBtn(
220,280,
350,80,
"EASY"
)

drawBtn(
710,280,
350,80,
"NORMAL"
)

drawBtn(
220,400,
350,80,
"HARD"
)

drawBtn(
710,400,
350,80,
"スキン"
)

drawBtn(
465,520,
350,80,
"マップ"
)

}

// スキン画面

function drawSkin(){

ctx.fillStyle="#87CEEB"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="60px JK"

ctx.fillText(
"スキン選択",
640,
120
)

ctx.font="70px JK"

skins.forEach((s,i)=>{

let x=
240+i*150

if(!isUnlocked(i)){

ctx.fillText(
"🔒",
x,
300
)

}else{

ctx.fillText(
s,
x,
300
)

}

if(i==selectedSkin){

ctx.strokeStyle="red"

ctx.lineWidth=5

ctx.strokeRect(
x-40,
250,
80,
80
)

}

})

ctx.fillStyle="gold"

ctx.font="40px JK"

ctx.fillText(
skinInfo[selectedSkin],
640,
450
)

ctx.fillStyle="black"

ctx.font="28px JK"

ctx.fillText(
"🦉🦅 7000",
640,
510
)

ctx.fillText(
"🐉 8000",
640,
550
)

drawBtn(
440,
610,
400,
70,
"もどる"
)

}

// マップ画面

function drawMap(){

ctx.fillStyle="#87CEEB"

ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="60px JK"

ctx.fillText(
"マップ選択",
640,
120
)

ctx.font="55px JK"

maps.forEach((m,i)=>{

let x=
260+i*250

if(
isMapUnlocked(i)
){

ctx.fillText(
m,
x,
300
)

}else{

ctx.fillText(
"🔒",
x,
300
)

}

if(
i==
selectedMap
){

ctx.strokeStyle="red"

ctx.lineWidth=5

ctx.strokeRect(
x-70,
240
// ゲーム描画

function drawGame(){

// 🌳草原

if(selectedMap==0){

ctx.fillStyle="#87CEEB"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="#6ab04c"
ctx.fillRect(
0,600,
1280,120
)

}

// 🌋火山

if(selectedMap==1){

ctx.fillStyle="#ff6b35"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="#3d1f00"
ctx.fillRect(
0,600,
1280,120
)

ctx.font="120px JK"
ctx.fillText(
"🌋",
1050,
180
)

}

// 🌙月

if(selectedMap==2){

ctx.fillStyle="#0f172a"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="#888"
ctx.fillRect(
0,600,
1280,120
)

ctx.font="120px JK"
ctx.fillText(
"🌙",
1050,
180
)

}

// 🪐宇宙

if(selectedMap==3){

ctx.fillStyle="#000022"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="#111"
ctx.fillRect(
0,600,
1280,120
)

ctx.font="120px JK"
ctx.fillText(
"🪐",
1050,
180
)

for(let i=0;i<40;i++){

ctx.fillStyle="white"

ctx.fillRect(
(i*97)%1280,
(i*57)%600,
3,
3
)

}

}

// プレイヤー

ctx.font="50px JK"

ctx.fillText(
skins[selectedSkin],
chicken.x,
chicken.y+40
)

// 障害物

obstacles.forEach(o=>{

ctx.font="55px JK"

if(selectedMap==0){

ctx.fillText(
"🌳",
o.x,
o.y+50
)

}

if(selectedMap==1){

ctx.fillText(
"🌋",
o.x,
o.y+50
)

}

if(selectedMap==2){

ctx.fillText(
"☄️",
o.x,
o.y+50
)

}

if(selectedMap==3){

ctx.fillText(
"👾",
o.x,
o.y+50
)

}

})

// ドラゴンエフェクト

ctx.font="30px JK"

effects.forEach(e=>{

ctx.globalAlpha=e.life

ctx.fillText(
"✨",
e.x,
e.y
)

ctx.globalAlpha=1

})

// スコア

ctx.textAlign="right"

ctx.font="32px JK"

ctx.fillStyle=
selectedMap>=2
?
"white"
:
"black"

ctx.fillText(
"Score "+score,
1220,
80
)

ctx.fillText(
"High "+highScore,
1220,
130
)

}
// GAME OVER

function drawGameOver(){

ctx.fillStyle="black"
ctx.fillRect(
0,0,
1280,720
)

ctx.fillStyle="white"

ctx.textAlign="center"

ctx.font="70px JK"

ctx.fillText(
"GAME OVER",
640,
220
)

ctx.font="45px JK"

ctx.fillText(
"Score "+score,
640,
320
)

ctx.fillText(
"High "+highScore,
640,
390
)

drawBtn(
440,
470,
400,
80,
"RESTART"
)

drawBtn(
440,
580,
400,
80,
"TITLE"
)

}

// 座標取得

function getPos(e){

const r=
canvas.getBoundingClientRect()

const sx=
canvas.width/r.width

const sy=
canvas.height/r.height

return{

x:
(e.clientX-r.left)*sx,

y:
(e.clientY-r.top)*sy

}

}

function inRect(
x,y,
rx,ry,
rw,rh
){

return(
x>rx &&
x<rx+rw &&
y>ry &&
y<ry+rh
)

}

// クリック

canvas.addEventListener(
"click",
e=>{

let p=getPos(e)

handleClick(
p.x,
p.y
)

}
)

function handleClick(x,y){

// タイトル

if(state=="title"){

if(
inRect(x,y,220,280,350,80)
) start("easy")

if(
inRect(x,y,710,280,350,80)
) start("normal")

if(
inRect(x,y,220,400,350,80)
) start("hard")

if(
inRect(x,y,710,400,350,80)
){
state="skin"
}

if(
inRect(x,y,465,520,350,80)
){
state="map"
}

}

// スキン

else if(state=="skin"){

skins.forEach((s,i)=>{

let sx=
240+i*150

if(

inRect(
x,
y,
sx-40,
250,
80,
80
)

&&

isUnlocked(i)

){

selectedSkin=i

localStorage.setItem(
"skin",
i
)

}

})

if(
inRect(
x,y,
440,610,
400,70
)
){

state="title"

}

}

// マップ

else if(state=="map"){

maps.forEach((m,i)=>{

let mx=
260+i*250

if(

inRect(
x,
y,
mx-70,
240,
140,
90
)

&&

isMapUnlocked(i)

){

selectedMap=i

}

})

if(
inRect(
x,y,
440,610,
400,70
)
){

state="title"

}

}

// GAMEOVER

else if(
state=="gameover"
){

if(
inRect(
x,y,
440,470,
400,80
)
){

reset()

state="game"

}

if(
inRect(
x,y,
440,580,
400,80
)
){

state="title"

}

}

}

// メインループ

function loop(){

update()

if(state=="title")
drawTitle()

if(state=="skin")
drawSkin()

if(state=="map")
drawMap()

if(state=="game")
drawGame()

if(state=="gameover")
drawGameOver()

requestAnimationFrame(
loop
)

}

loop()
