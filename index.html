<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ちきんゲームDX</title>

<style>
body{
margin:0;
background:#ddd;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:sans-serif;
}

#gameBox{
width:90vw;
max-width:800px;
aspect-ratio:16/9;
background:black;
border-radius:20px;
overflow:hidden;
}

canvas{
width:100%;
height:100%;
}
</style>
</head>

<body>

<div id="gameBox">
<canvas id="game"></canvas>
</div>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=1280
canvas.height=720

let state="title"

let score=0
let highScore=Number(localStorage.getItem("high")||0)

let maps=[
"🌳草原",
"🌋火山",
"🌙月",
"🪐宇宙"
]

let selectedMap=
Number(localStorage.getItem("map")||0)

let skins=[
"🐔",
"🐤",
"🍗",
"🦉",
"🦅",
"🐉"
]

let selectedSkin=
Number(localStorage.getItem("skin")||0)

let skinInfo=[
"★★★",
"★★★",
"★★★",
"★★★★",
"★★★★",
"★★★★★"
]

function isUnlocked(i){

if(i<=2) return true

if(i==3 && highScore>=7000)
return true

if(i==4 && highScore>=7000)
return true

if(i==5 && highScore>=8000)
return true

return false
}

function isMapUnlocked(i){

if(i==0) return true

if(i==1 && highScore>=5000)
return true

if(i==2 && highScore>=8000)
return true

if(i==3 && highScore>=9000)
return true

return false
}

let jumpPower=16
let gravity=0.8

function applySkin(){

if(selectedSkin==0){
jumpPower=14
gravity=0.85
}

if(selectedSkin==1){
jumpPower=17
gravity=0.8
}

if(selectedSkin==2){
jumpPower=17
gravity=0.8
}

if(selectedSkin==3){
jumpPower=18
gravity=0.78
}

if(selectedSkin==4){
jumpPower=19
gravity=0.76
}

if(selectedSkin==5){
jumpPower=20
gravity=0.75
}
}

let chicken
let obstacles=[]

let baseSpeed=7
let speed=7
let maxSpeed=15

let effects=[]

function createEffect(){

if(selectedSkin!=5) return

for(let i=0;i<6;i++){

effects.push({

x:chicken.x+25,
y:chicken.y+25,

vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,

life:1

})

}
}

function reset(){

chicken={

x:200,
y:560,

vy:0,

jump:0

}

obstacles=[]

effects=[]

score=0

speed=baseSpeed
}

function start(mode){

if(mode=="easy"){
baseSpeed=5
maxSpeed=10
}
else if(mode=="hard"){
baseSpeed=9
maxSpeed=18
}
else{
baseSpeed=7
maxSpeed=15
}

applySkin()

reset()

state="game"
}

function tap(){

if(state!="game") return

if(chicken.jump<2){

if(chicken.jump==0){
chicken.vy=-jumpPower
}
else{
chicken.vy=-(jumpPower-2)
}

chicken.jump++

createEffect()
}
}

document.addEventListener(
"touchstart",
tap
)

document.addEventListener(
"mousedown",
tap
)

setInterval(()=>{

if(state=="game"){

obstacles.push({

x:1280,
y:540

})

}

},1200)

function update(){

if(state!="game")
return

chicken.vy+=gravity

chicken.y+=chicken.vy

if(chicken.y>560){

chicken.y=560

chicken.vy=0

chicken.jump=0
}

speed=
baseSpeed+
score*0.005

if(speed>maxSpeed)
speed=maxSpeed

obstacles.forEach(o=>{

o.x-=speed

if(

chicken.x < o.x+40 &&

chicken.x+50 > o.x &&

chicken.y < o.y+80 &&

chicken.y+50 > o.y

){

state="gameover"

if(score>highScore){

highScore=score

localStorage.setItem(
"high",
highScore
)

}

}

})

effects.forEach(e=>{

e.x+=e.vx
e.y+=e.vy

e.life-=0.03

})

effects=
effects.filter(
e=>e.life>0
)

obstacles=
obstacles.filter(
o=>o.x>-50
)

score++
}
function drawBtn(x,y,w,h,text){

ctx.fillStyle="white"
ctx.fillRect(x,y,w,h)

ctx.fillStyle="black"
ctx.font="35px sans-serif"
ctx.textAlign="center"

ctx.fillText(
text,
x+w/2,
y+h/2+12
)

}

function drawTitle(){

ctx.fillStyle="#87CEEB"
ctx.fillRect(
0,
0,
1280,
720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="70px sans-serif"

ctx.fillText(
"🐔 ちきんゲームDX",
640,
180
)

drawBtn(
440,
280,
400,
80,
"EASY"
)

drawBtn(
440,
390,
400,
80,
"NORMAL"
)

drawBtn(
440,
500,
400,
80,
"HARD"
)

drawBtn(
440,
610,
400,
70,
"スキン選択"
)

drawBtn(
20,
610,
320,
70,
"マップ選択"
)

}

function drawSkin(){

ctx.fillStyle="#87CEEB"
ctx.fillRect(
0,
0,
1280,
720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="60px sans-serif"

ctx.fillText(
"スキン選択",
640,
120
)

ctx.font="70px sans-serif"

skins.forEach((s,i)=>{

let x=
240+i*150

if(!isUnlocked(i)){

ctx.fillText(
"🔒",
x,
300
)

}else{

ctx.fillText(
s,
x,
300
)

}

if(i==selectedSkin){

ctx.strokeStyle="red"

ctx.lineWidth=5

ctx.strokeRect(
x-40,
250,
80,
80
)

}

})

ctx.fillStyle="gold"

ctx.font="40px sans-serif"

ctx.fillText(
skinInfo[selectedSkin],
640,
450
)

ctx.fillStyle="black"

ctx.font="28px sans-serif"

ctx.fillText(
"🦉🦅:7000　🐉:8000",
640,
510
)

drawBtn(
440,
580,
400,
80,
"もどる"
)

}

function drawMap(){

ctx.fillStyle="#87CEEB"

ctx.fillRect(
0,
0,
1280,
720
)

ctx.fillStyle="black"

ctx.textAlign="center"

ctx.font="60px sans-serif"

ctx.fillText(
"マップ選択",
640,
120
)

ctx.font="55px sans-serif"

maps.forEach((m,i)=>{

let x=
260+i*250

if(isMapUnlocked(i)){

ctx.fillText(
m,
x,
300
)

}else{

ctx.fillText(
"🔒",
x,
300
)

}

if(i==selectedMap){

ctx.strokeStyle="red"

ctx.lineWidth=5

ctx.strokeRect(
x-70,
240,
140,
90
)

}

})

ctx.font="30px sans-serif"

ctx.fillStyle="black"

ctx.fillText(
"🌋5000　🌙8000　🪐9000",
640,
500
)

drawBtn(
440,
580,
400,
80,
"もどる"
)

}
function drawGame(){

// 草原
if(selectedMap==0){

ctx.fillStyle="#87CEEB"
ctx.fillRect(0,0,1280,720)

ctx.fillStyle="#6ab04c"
ctx.fillRect(0,600,1280,120)

}

// 火山
if(selectedMap==1){

ctx.fillStyle="#ff6b35"
ctx.fillRect(0,0,1280,720)

ctx.fillStyle="#3d1f00"
ctx.fillRect(0,600,1280,120)

ctx.font="120px sans-serif"
ctx.fillText("🌋",1000,180)

}

// 月
if(selectedMap==2){

ctx.fillStyle="#0f172a"
ctx.fillRect(0,0,1280,720)

ctx.fillStyle="#888"
ctx.fillRect(0,600,1280,120)

ctx.font="120px sans-serif"
ctx.fillText("🌙",1000,180)

}

// 宇宙
if(selectedMap==3){

ctx.fillStyle="#000022"
ctx.fillRect(0,0,1280,720)

ctx.fillStyle="#111"
ctx.fillRect(0,600,1280,120)

for(let i=0;i<40;i++){

ctx.fillStyle="white"

ctx.fillRect(
(i*97)%1280,
(i*53)%600,
3,
3
)

}

ctx.font="120px sans-serif"
ctx.fillText("🪐",1000,180)

}

// プレイヤー

ctx.font="50px sans-serif"

ctx.textAlign="left"

ctx.fillText(
skins[selectedSkin],
chicken.x,
chicken.y+40
)

// 障害物

obstacles.forEach(o=>{

ctx.font="55px sans-serif"

if(selectedMap==0)
ctx.fillText("🌳",o.x,o.y+50)

if(selectedMap==1)
ctx.fillText("🌋",o.x,o.y+50)

if(selectedMap==2)
ctx.fillText("☄️",o.x,o.y+50)

if(selectedMap==3)
ctx.fillText("👾",o.x,o.y+50)

})

// エフェクト

ctx.font="30px sans-serif"

effects.forEach(e=>{

ctx.globalAlpha=e.life

ctx.fillText(
"✨",
e.x,
e.y
)

ctx.globalAlpha=1

})

// スコア

ctx.fillStyle="white"

ctx.textAlign="right"

ctx.font="32px sans-serif"

ctx.fillText(
"Score "+score,
1220,
80
)

ctx.fillText(
"High "+highScore,
1220,
130
)

}

function drawGameOver(){

ctx.fillStyle="black"
ctx.fillRect(0,0,1280,720)

ctx.fillStyle="white"

ctx.textAlign="center"

ctx.font="70px sans-serif"

ctx.fillText(
"GAME OVER",
640,
220
)

ctx.font="45px sans-serif"

ctx.fillText(
"Score "+score,
640,
320
)

ctx.fillText(
"High "+highScore,
640,
380
)

drawBtn(
440,
450,
400,
80,
"RESTART"
)

drawBtn(
440,
560,
400,
80,
"TITLE"
)

}

function getPos(e){

const r=
canvas.getBoundingClientRect()

const sx=
canvas.width/r.width

const sy=
canvas.height/r.height

return{

x:(e.clientX-r.left)*sx,
y:(e.clientY-r.top)*sy

}

}

function inRect(
x,y,
rx,ry,
rw,rh
){

return(
x>rx &&
x<rx+rw &&
y>ry &&
y<ry+rh
)

}

canvas.addEventListener(
"click",
e=>{

let p=getPos(e)

handleClick(
p.x,
p.y
)

}
)

function handleClick(x,y){

if(state=="title"){

if(inRect(x,y,440,280,400,80))
start("easy")

if(inRect(x,y,440,390,400,80))
start("normal")

if(inRect(x,y,440,500,400,80))
start("hard")

if(inRect(x,y,440,610,400,70))
state="skin"

if(inRect(x,y,20,610,320,70))
state="map"

}

else if(state=="skin"){

skins.forEach((s,i)=>{

let sx=
240+i*150

if(
inRect(
x,y,
sx-40,
250,
80,
80
)
){

if(isUnlocked(i)){

selectedSkin=i

localStorage.setItem(
"skin",
i
)

}

}

})

if(inRect(x,y,440,580,400,80))
state="title"

}

else if(state=="map"){

maps.forEach((m,i)=>{

let mx=
260+i*250

if(
inRect(
x,y,
mx-70,
240,
140,
90
)
){

if(isMapUnlocked(i)){

selectedMap=i

localStorage.setItem(
"map",
i
)

}

}

})

if(inRect(x,y,440,580,400,80))
state="title"

}

else if(state=="gameover"){

if(inRect(x,y,440,450,400,80)){

reset()

state="game"

}

if(inRect(x,y,440,560,400,80)){

state="title"

}

}

}

function loop(){

update()

if(state=="title")
drawTitle()

if(state=="skin")
drawSkin()

if(state=="map")
drawMap()

if(state=="game")
drawGame()

if(state=="gameover")
drawGameOver()

requestAnimationFrame(loop)

}

loop()

</script>
</body>
</html>
